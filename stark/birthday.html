<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 💖</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe5f0, #f0ddff, #fff0f5);
    }

    .card {
      width: min(100%, 1100px);
      min-height: 560px;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255,255,255,.8);
      border-radius: 32px;
      box-shadow: 0 20px 60px #bd4b9220;
      animation: reveal 1s ease;
    }

    .cake-container {
      position: relative;
      flex: 1 1 50%;
      min-width: 0;
      height: 500px;
      overflow: hidden;
      border-radius: 24px;
      background: radial-gradient(circle, #fff8fc 0%, #f9e8ff 70%, #f4e2ff 100%);
    }

    .birthday-content {
      flex: 1 1 50%;
      min-width: 0;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {
      body { padding: 14px; }
      .card {
        flex-direction: column;
        min-height: auto;
        padding: 16px;
        gap: 10px;
      }
      .cake-container {
        flex: none;
        width: 100%;
        height: 330px;
      }
      .birthday-content {
        flex: none;
        width: 100%;
        padding: 12px 8px 20px;
      }
      h1 { font-size: clamp(42px, 12vw, 62px); }
    }

    .heart {
      font-size: 65px;
      animation: beat 1.4s infinite;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(45px, 8vw, 76px);
      color: #d63384;
      margin: 15px 0;
    }

    p {
      color: #79516e;
      line-height: 1.9;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      color: white;
      background: linear-gradient(100deg, #ff5fa2, #a855d8);
      text-decoration: none;
      border-radius: 14px;
    }

    @keyframes beat {
      50% { transform: scale(1.15); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <main class="card">
    <div id="cake-container" class="cake-container" aria-label="Interactive 3D birthday cake"></div>

    <section class="birthday-content">
      <div class="heart">💖</div>

      <h1>Happy Birthday!</h1>

      <p>
        Today is your special day! 🎂
        <br>
        May your life be filled with love,
        happiness, laughter and beautiful memories.
        <br>
        You deserve all the wonderful things in the world. 🌷
      </p>

      <h2>Made with love 💗</h2>
    <!-- Background Music -->
<audio id="birthdayMusic" loop preload="auto">
    <source src="success.mp3" type="audio/mpeg">
</audio>

<!-- Music Button -->
<button id="musicButton" type="button">
    🎵 Play Music 💗
</button>

<style>
    #musicButton {
        position: fixed;
        bottom: 15px;
        right: 15px;
        z-index: 10;
        padding: 12px 18px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(135deg, #ff69b4, #a855d8);
        color: white;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 4px 15px #d6338433;
    }
</style>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const container = document.getElementById('cake-container') || document.body;

const scene = new THREE.Scene();
scene.background = null;

const camera = new THREE.PerspectiveCamera(
  40,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(0, 3.8, 9);
camera.lookAt(0, 1.6, 0);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});
renderer.setSize(1, 1);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

renderer.domElement.style.cssText =
  'display:block;width:100%;height:100%;position:absolute;inset:0;';

container.style.position = 'relative';
container.style.overflow = 'hidden';
container.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.AmbientLight(0xffffff, 1.8));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
scene.add(keyLight);

const pinkLight = new THREE.PointLight(0xff8fcf, 35, 15);
pinkLight.position.set(-4, 3, 3);
scene.add(pinkLight);

const blueLight = new THREE.PointLight(0x8abaff, 25, 15);
blueLight.position.set(4, 4, -3);
scene.add(blueLight);

// Cake group
const cake = new THREE.Group();
scene.add(cake);

// Materials
const spongeMaterial = new THREE.MeshStandardMaterial({
  color: 0xffb8c9,
  roughness: 0.32
});

const frostingMaterial = new THREE.MeshStandardMaterial({
  color: 0xfff0f5,
  roughness: 0.24
});

const creamMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.3
});

const plateMaterial = new THREE.MeshStandardMaterial({
  color: 0xffd5e5,
  metalness: 0.18,
  roughness: 0.23
});

// Cylinder helper
function cylinder(radiusTop, radiusBottom, height, material, y, segments = 96) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      segments
    ),
    material
  );

  mesh.position.y = y;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cake.add(mesh);
  return mesh;
}

// Cake plate
cylinder(2.0, 2.0, 0.14, plateMaterial, 0.12);
cylinder(1.8, 1.9, 0.12, creamMaterial, 0.25);

// Two cake layers
cylinder(1.55, 1.55, 0.85, spongeMaterial, 0.73);
cylinder(1.62, 1.62, 0.16, frostingMaterial, 1.18);

cylinder(1.22, 1.22, 0.65, spongeMaterial, 1.55);
cylinder(1.3, 1.3, 0.16, frostingMaterial, 1.94);

// Top frosting
cylinder(1.3, 1.3, 0.09, creamMaterial, 2.035);

// Frosting drips
for (let i = 0; i < 22; i++) {
  const angle = (i / 22) * Math.PI * 2;
  const dripHeight = 0.12 + Math.random() * 0.24;

  const drip = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 16, 16),
    creamMaterial
  );

  drip.scale.set(1, dripHeight / 0.105, 0.8);
  drip.position.set(
    Math.cos(angle) * 1.275,
    1.99 - dripHeight * 0.55,
    Math.sin(angle) * 1.275
  );

  drip.castShadow = true;
  cake.add(drip);
}

// Cream swirls around the top
for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;

  const cream = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 24, 24),
    creamMaterial
  );

  cream.scale.set(1, 0.75, 1);

  cream.position.set(
    Math.cos(angle) * 0.99,
    2.12,
    Math.sin(angle) * 0.99
  );

  cream.castShadow = true;
  cake.add(cream);
}

// Colorful sprinkles
const sprinkleColors = [
  0xff4081, 0xffd740, 0x54d8ff,
  0x8c65ff, 0x62e6a7, 0xffffff
];

for (let i = 0; i < 100; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 0.25 + Math.random() * 0.95;

  const sprinkle = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.018, 0.07, 3, 6),
    new THREE.MeshStandardMaterial({
      color: sprinkleColors[
        Math.floor(Math.random() * sprinkleColors.length)
      ],
      roughness: 0.3
    })
  );

  sprinkle.position.set(
    Math.cos(angle) * radius,
    2.09 + Math.random() * 0.025,
    Math.sin(angle) * radius
  );

  sprinkle.rotation.set(
    Math.random() * 0.5,
    Math.random() * Math.PI,
    Math.random() * Math.PI
  );

  cake.add(sprinkle);
}

// Candles
const candles = [];
const flames = [];
const flameLights = [];

const candleColors = [
  0x8e8bff,
  0xff78ad,
  0xffd166,
  0x79dfd1,
  0xb8a0ff
];

for (let i = 0; i < 5; i++) {
  const angle = (i / 5) * Math.PI * 2;
  const x = Math.cos(angle) * 0.67;
  const z = Math.sin(angle) * 0.67;
  const candleY = 2.12;

  const candle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.06, 0.65, 20),
    new THREE.MeshStandardMaterial({
      color: candleColors[i],
      roughness: 0.3
    })
  );

  candle.position.set(x, candleY + 0.325, z);
  candle.castShadow = true;
  cake.add(candle);
  candles.push(candle);

  // Candle stripes
  for (let stripe = 0; stripe < 5; stripe++) {
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(0.055, 0.008, 6, 20),
      creamMaterial
    );

    band.rotation.x = Math.PI / 2;
    band.position.set(x, candleY + 0.12 + stripe * 0.1, z);
    cake.add(band);
  }

  // Flame
  const flameMaterial = new THREE.MeshBasicMaterial({
    color: 0xffa51f
  });

  const flame = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 24, 24),
    flameMaterial
  );

  flame.scale.set(0.72, 1.65, 0.72);
  flame.position.set(x, candleY + 0.76, z);
  cake.add(flame);
  flames.push(flame);

  const innerFlame = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffc2 })
  );

  innerFlame.scale.set(0.8, 1.35, 0.8);
  innerFlame.position.set(x, candleY + 0.74, z);
  cake.add(innerFlame);

  const flameLight = new THREE.PointLight(0xffa333, 1.4, 1.8);
  flameLight.position.set(x, candleY + 0.8, z);
  cake.add(flameLight);
  flameLights.push(flameLight);
}

// Decorative cherries
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;

  const cherry = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 20, 20),
    new THREE.MeshStandardMaterial({
      color: 0xe62d58,
      roughness: 0.2,
      metalness: 0.05
    })
  );

  cherry.position.set(
    Math.cos(angle) * 0.48,
    2.15,
    Math.sin(angle) * 0.48
  );

  cake.add(cherry);
}

// Soft shadow below the cake
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.1, 64),
  new THREE.MeshBasicMaterial({
    color: 0x665577,
    transparent: true,
    opacity: 0.13,
    depthWrite: false
  })
);

shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.035;
cake.add(shadow);

// Animation state
let time = 0;
let isBlownOut = false;
let blowing = false;
let blowStrength = 0;
let blowStart = 0;

const clock = new THREE.Clock();

// Mouse interaction: move to rotate the cake
let targetRotationY = 0;
let targetRotationX = 0;

renderer.domElement.addEventListener('pointermove', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();

  const x = (event.clientX - rect.left) / rect.width;
  const y = (event.clientY - rect.top) / rect.height;

  targetRotationY = (x - 0.5) * 0.55;
  targetRotationX = (0.5 - y) * 0.12;
});

// Blow out candles on click/tap
function blowOutCandles() {
  if (isBlownOut || blowing) return;

  blowing = true;
  blowStart = time;
  blowStrength = 0;
}

renderer.domElement.addEventListener('click', blowOutCandles);

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  time += delta;

  // Gentle floating movement
  cake.position.y = Math.sin(time * 1.2) * 0.045;
  cake.rotation.y += (targetRotationY - cake.rotation.y) * 0.035;
  cake.rotation.x += (targetRotationX - cake.rotation.x) * 0.035;

  // Flickering candle flames
  flames.forEach((flame, i) => {
    const flicker = Math.sin(time * 12 + i * 2.1) * 0.08;

    if (!isBlownOut) {
      flame.scale.y = 1.65 + flicker;
      flame.scale.x = 0.72 + Math.sin(time * 9 + i) * 0.06;
      flame.rotation.z = Math.sin(time * 8 + i) * 0.12;
      flame.visible = true;

      flameLights[i].intensity =
        1.1 + Math.sin(time * 13 + i) * 0.25;
    } else {
      flame.visible = false;
      flameLights[i].intensity = 0;
    }
  });

  // Brief animated gust, then extinguish the candles
  if (blowing) {
    const elapsed = time - blowStart;
    blowStrength = Math.min(elapsed / 0.65, 1);

    flames.forEach((flame, i) => {
      flame.scale.x = Math.max(
        0.01,
        0.72 * (1 - blowStrength)
      );

      flame.scale.y = Math.max(
        0.01,
        1.65 * (1 - blowStrength)
      );

      flame.rotation.z = -0.9 * blowStrength;
    });

    if (elapsed > 0.65) {
      isBlownOut = true;
      blowing = false;
    }
  }

  renderer.render(scene, camera);
}

animate();

// Responsive resizing
function resizeCake() {
  const width = container.clientWidth || 500;
  const height = container.clientHeight || 500;

  camera.aspect = width / height;
  camera.position.z = width < 600 ? 11 : 9;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

window.addEventListener('resize', resizeCake);
resizeCake();

// Optional public controls
window.cakeControls = {
  blowOut: blowOutCandles,

  relight() {
    isBlownOut = false;
    blowing = false;

    flames.forEach((flame) => {
      flame.visible = true;
      flame.scale.set(0.72, 1.65, 0.72);
    });

    flameLights.forEach((light) => {
      light.intensity = 1.4;
    });
  },

  setBackground(color) {
    scene.background = color
      ? new THREE.Color(color)
      : null;
  }
};
</script>
<script>
    const music = document.getElementById("birthdayMusic");
    const musicButton = document.getElementById("musicButton");

    async function playMusic() {
        try {
            await music.play();
            musicButton.textContent = "⏸ Pause Music";
        } catch (error) {
            musicButton.textContent = "🎵 Play Music 💗";
        }
    }

    musicButton.addEventListener("click", async () => {
        if (music.paused) {
            await playMusic();
        } else {
            music.pause();
            musicButton.textContent = "🎵 Play Music 💗";
        }
    });

    // Try autoplay when the birthday page opens
    playMusic();
</script>

      <a class="back" href="memories.html">next →</a>
    </section>
  </main>
</body>
</html>

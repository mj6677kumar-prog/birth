<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Birthday Surprise 💗</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fff0f6, #f1e6ff, #ffe4ec);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      padding: 35px 7%;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 35px;
    }

    .left {
      animation: appear 1s ease;
    }

    .tag {
      color: #b34d91;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(48px, 6vw, 82px);
      line-height: 1.15;
      color: #d63384;
      margin-bottom: 18px;
    }

    .message {
      color: #79516e;
      font-size: 15px;
      line-height: 1.9;
      max-width: 400px;
      margin-bottom: 25px;
    }

    .cat-photo {
      width: 210px;
      height: 175px;
      object-fit: cover;
      border-radius: 24px;
      border: 5px solid white;
      box-shadow: 0 12px 35px #d6338425;
      transform: rotate(-3deg);
      transition: transform .3s;
    }

    .cat-photo:hover {
      transform: rotate(0deg) scale(1.05);
    }

    .right {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lock-card {
      width: min(100%, 330px);
      padding: 35px 25px;
      border-radius: 32px;
      text-align: center;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 20px 60px #b34d9125;
      backdrop-filter: blur(15px);
      animation: float 4s ease-in-out infinite;
    }

    .heart {
      font-size: 68px;
      cursor: pointer;
      display: inline-block;
      filter: drop-shadow(0 8px 12px #ff4d8d40);
      transition: transform .3s;
      animation: heartbeat 1.6s infinite;
    }

    .heart:hover {
      transform: scale(1.2);
    }

    .lock-card h2 {
      font-size: 21px;
      color: #9b347a;
      margin: 10px 0 5px;
    }

    .lock-card p {
      color: #9b7893;
      font-size: 12px;
      margin-bottom: 18px;
    }

    #pin {
      width: 100%;
      padding: 14px;
      border: 1px solid #f0c5df;
      border-radius: 15px;
      background: #fff8fc;
      outline: none;
      text-align: center;
      font-size: 22px;
      letter-spacing: 8px;
      color: #b83280;
    }

    #pin:focus {
      border-color: #d63384;
      box-shadow: 0 0 0 3px #d6338418;
    }

    .unlock {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 15px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      background: linear-gradient(100deg, #ff5fa2, #a855d8);
      box-shadow: 0 8px 20px #d6338430;
      transition: transform .2s;
    }

    .unlock:hover {
      transform: translateY(-3px);
    }

    #error {
      color: #d63365;
      font-size: 12px;
      margin-top: 12px;
      min-height: 18px;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      body {
        padding: 35px 22px;
      }

      .container {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .left {
        text-align: center;
      }

      .message {
        margin-left: auto;
        margin-right: auto;
      }

      .cat-photo {
        width: 180px;
        height: 150px;
      }

      .lock-card {
        max-width: 320px;
      }
    }
  </style>
</head>
